
[package]
name = "agregador_rss"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls"] }
feed-rs = "2"

mysql = { version = "26", features = ["chrono"] }

dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
url = "2"
futures = "0.3"
sha2 = "0.10"

[dev-dependencies]
mockito = "1"